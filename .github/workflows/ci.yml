name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

env:
  # The repo's top-level vendor/ directory holds the omnist-spec git
  # submodule, not Go's vendor tree. Once go.mod carries a real external
  # dependency, Go's automatic vendor-mode detection treats that directory
  # as inconsistent Go vendoring and refuses to build. -mod=mod disables
  # that auto-detection everywhere in this workflow.
  GOFLAGS: -mod=mod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go build ./...
      - run: go vet ./...
      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforce 100% line coverage
        run: |
          go tool cover -func=coverage.out
          # Per-function check, not the aggregate "total" line: with zero
          # statements (e.g. a const-only file) the total line reports a
          # spurious 0.0% (0/0), which would wrongly fail this gate.
          #
          # tools/conformance/** is excluded: it's the conformance harness
          # itself (issue #31), whose primary verification is running it
          # for real against omnist-spec's test-suite vectors (the
          # `conformance` job below), not exhaustive unit coverage -- most
          # of its branches are per-operation drivers that only make sense
          # exercised against real vectors, not synthesized in isolation.
          #
          # tools/check_doc_examples/ is excluded the same way (issue #62):
          # its primary verification is the `doc-examples` job below
          # actually running it against real docs/*.md content (including
          # the adversarial "does it fail on a deliberately-unmarked
          # block" check performed when that job was built), not unit
          # coverage of a small, single-purpose CLI tool.
          #
          # Two specific functions in cmd/omnist are excluded (issue #37),
          # scoped tightly rather than excluding the whole package -- every
          # other function in cmd/omnist holds the normal 100% bar via
          # run_test.go's in-process tests, so a regression anywhere else
          # in that package still fails this gate:
          #   - app.go's main(): calls os.Exit, can't be driven from a
          #     normal `go test` without terminating the test binary.
          #     Verified instead by real subprocess invocations of the
          #     built binary (cmd/omnist/subprocess_test.go).
          #   - cmd_materialize.go's cmdMaterialize (97.1%): one branch
          #     handling a non-nil error from Materialize, which
          #     materialize.go's own doc comment says is "always nil
          #     today" (kept only for future signature stability) -- there
          #     is currently no way to make that branch return a non-nil
          #     error to exercise it.
          uncovered=$(go tool cover -func=coverage.out | grep -v '^total:' | grep -v '100.0%$' | grep -v '^github.com/omnist-dev/omnist-go/tools/conformance/' | grep -v '^github.com/omnist-dev/omnist-go/tools/check_doc_examples/' | grep -v '^github.com/omnist-dev/omnist-go/cmd/omnist/app.go:.*[[:space:]]main[[:space:]]' | grep -v '^github.com/omnist-dev/omnist-go/cmd/omnist/cmd_materialize.go:.*[[:space:]]cmdMaterialize[[:space:]]' || true)
          if [ -n "$uncovered" ]; then
            echo "The following functions are not fully covered:"
            echo "$uncovered"
            exit 1
          fi
          echo "100% line coverage confirmed (tools/conformance/** and two cmd/omnist functions excluded, see comment)."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Fuzz the six format readers (issue #57)
        run: |
          # This step is deliberately short and time-boxed -- 10s per
          # reader, 60s total -- not an unbounded fuzz run. Its job is
          # twofold:
          #
          #  1. Regression protection: every one of the six FuzzRead
          #     functions' testdata/fuzz/FuzzRead/* corpus (committed
          #     whenever a local `go test -fuzz` run finds a crasher, per
          #     Go's standard fuzzing convention) already runs as part of
          #     the `test` job above via plain `go test ./...` -- that
          #     alone re-checks every previously-found crasher on every
          #     push. This job's own short -fuzz burst is additional,
          #     exploratory coverage beyond the fixed corpus, not the
          #     regression check itself.
          #  2. A cheap tripwire for new crashers: readers are the one
          #     class of code in this repo that consumes untrusted input
          #     (see FuzzRead's doc comment in each package for why), so a
          #     little continuous exploration on every push is worth 60s
          #     of CI time even though it can never be exhaustive.
          #
          # A real, longer local fuzz run (30-60s per package) is how
          # issue #57 itself was verified before committing -- this step
          # is not a substitute for that, just an ongoing cheap check.
          set -e
          for pkg in ./oml ./osd ./formats/json ./formats/yaml ./formats/toml ./formats/xml; do
            echo "::group::fuzz $pkg"
            go test "$pkg" -run=FuzzRead -fuzz=FuzzRead -fuzztime=10s
            echo "::endgroup::"
          done

  doc-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Verify docs/*.md code-block markers (issue #62)
        run: |
          # Every fenced code block in docs/*.md must carry a
          # <!-- verified-by: ... --> or <!-- doc-illustrative --> marker
          # for any block that's new or changed relative to origin/main.
          # This is a doc-quality gate, not a judgment-call conformance
          # gate (unlike the `conformance` job below) -- a missing marker
          # is unambiguous, so this job is blocking. See
          # docs/workflow-playbook.md Sec7 and tools/check_doc_examples/.
          git fetch origin main
          go run ./tools/check_doc_examples -base=origin/main

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Run govulncheck (issue #73)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Run conformance harness (Track 2, JSON-vector)
        run: |
          if [ -d tools/conformance/cmd/conformance ]; then
            # Informational for now, not gating: as of issue #31 there are
            # 26 known real failures against omnist-spec's test-suite,
            # each already filed for a follow-up fix. CI gating (fail the
            # build on nonzero fail count, per spec Sec8.5.5) lands once
            # those are cleared -- see workflow-playbook.md Sec4.
            go run ./tools/conformance/cmd/conformance || true
          else
            echo "conformance harness not yet built - skipping (tracked in workflow-playbook.md Sec4)"
          fi
      - name: Run conformance harness (Track 1, fixture-based)
        run: |
          if [ -d tools/conformance/cmd/conformance-fixtures ]; then
            # Informational for now, not gating, same reasoning as Track 2
            # above: issue #55 found one real, upstream fixture defect
            # (lint/edge-case-unreachable-record's expected.json omits the
            # "lint." code-namespace prefix every other lint code and
            # Track 2's own vectors use) -- filed upstream, not something
            # this repo can fix in a vendored submodule. CI gating lands
            # once that's cleared.
            go run ./tools/conformance/cmd/conformance-fixtures || true
          else
            echo "Track 1 conformance harness not yet built - skipping"
          fi
